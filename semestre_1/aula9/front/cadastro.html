<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/cadastro.css">

  <title>TechFood - Cadastro de Pratos</title>
</head>
<body>

<header id="topo-loja">
  <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
  <p id="boas-vindas">Carregando...</p>

  <input type="checkbox" id="bt_menu">
  <label for="bt_menu" id="label-menu">&#9776;</label>

  <nav id="menu">
    <ul>
      <li><a href="index.html">Cardápio</a></li>
      <li><a href="pedidos.html">Meus Pedidos</a></li>
      <li><a href="cadastro.html" class="ativo">Cadastrar Prato</a></li>
    </ul>
  </nav>
</header>

<main>

  <section id="secao-cadastro">

    <h2 class="titulo-secao"> Cadastro de Pratos</h2>

    <form id="form-cadastro">

      <div class="grupo-campo">
        <label for="nome">Nome do prato</label>
        <input
          type="text"
          id="nome"
          maxlength="100"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          rows="4"
          required
        ></textarea>
      </div>

      <div class="grupo-campo">
        <label for="preco">Preço</label>
        <input
          type="number"
          id="preco"
          step="0.01"
          min="0"
          required
        >
      </div>

      <div class="grupo-campo">
        <label for="categoria">Categoria</label>

        <select id="categoria" required>
          <option value="">Selecione</option>
          <option value="Lanche">Lanche</option>
          <option value="Pizza">Pizza</option>
          <option value="Bebida">Bebida</option>
          <option value="Sobremesa">Sobremesa</option>
        </select>
      </div>

      <div class="grupo-campo">
        <label for="imagem">Imagem (URL)</label>
        <input
          type="text"
          id="imagem"
          placeholder="https://..."
          required
        >
      </div>

      <button type="submit" id="btn-cadastrar">
        Cadastrar Prato
      </button>

    </form>

    <p id="mensagem"></p>

  </section>

</main>

<footer id="rodape">
  <div class="info-footer">
    <p><strong>TechFood 2026</strong></p>
    <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
    <p>Av. das Nações, 1500</p>
  </div>

  <p id="data-hora-footer"></p>
</footer>

<script src="src/scripts/global.js"></script>
<script src="src/scripts/api.js"></script>
<script src="src/scripts/cadastro.js"></script>

</body>
</html>
